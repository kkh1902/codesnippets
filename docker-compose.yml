version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: codesnippets_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: codesnippets
      MYSQL_USER: snippetuser
      MYSQL_PASSWORD: snippetpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    container_name: codesnippets_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql://snippetuser:snippetpass@mysql:3306/codesnippets
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: codesnippets_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  mysql_data:
